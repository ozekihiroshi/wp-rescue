name: Compose configuration

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file .env.example -f docker-compose.yml config --quiet
      - run: docker compose --env-file .env.example -f docker-compose.local.yml config --quiet
      - run: docker compose --env-file .env.example -f docker-compose.ziptest.yml config --quiet
