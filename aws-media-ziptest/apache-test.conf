# Listen on the same port inside and outside Docker so WP-Cron loopback works.
Listen 8084
<VirtualHost *:8084>
    DocumentRoot /var/www/html
</VirtualHost>

<IfModule mpm_prefork_module>
    StartServers 1
    MinSpareServers 1
    MaxSpareServers 2
    MaxRequestWorkers 2
    MaxConnectionsPerChild 100
</IfModule>
