services:
  wp-rescue:
    image: wordpress:php8.3-apache
    build:
      context: .
      dockerfile: wordpress/Dockerfile
    container_name: wp-rescue-local
    restart: unless-stopped

    environment:
      WORDPRESS_DB_HOST: wp-rescue-db:3306
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: wp_

    ports:
      - "8081:80"

    volumes:
      - wp_rescue_html:/var/www/html
      - ./wordpress/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
      - ../secure-s3-storage-for-wordpress:/var/www/html/wp-content/plugins/ozeki-database-backup-for-s3
    depends_on:
      - wp-rescue-db

    networks:
      - internal

  wp-rescue-db:
    image: mariadb:11
    container_name: wp-rescue-db-local
    restart: unless-stopped

    environment:
      MARIADB_DATABASE: ${WORDPRESS_DB_NAME}
      MARIADB_USER: ${WORDPRESS_DB_USER}
      MARIADB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}

    volumes:
      - wp_rescue_db:/var/lib/mysql

    networks:
      - internal

  wp-cli:
    image: wordpress:cli-php8.3
    container_name: wp-rescue-cli-local

    profiles:
      - cli

    working_dir: /var/www/html

    environment:
      WORDPRESS_DB_HOST: wp-rescue-db:3306
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}

    volumes:
      - wp_rescue_html:/var/www/html
      - ../secure-s3-storage-for-wordpress:/var/www/html/wp-content/plugins/ozeki-database-backup-for-s3

    depends_on:
      - wp-rescue-db

    networks:
      - internal

volumes:
  wp_rescue_html:
  wp_rescue_db:

networks:
  internal:
